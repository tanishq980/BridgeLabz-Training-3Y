<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>
<body>
    <h1>Upload Your Photo</h1>
    <form method="post" action="#">
        <input type="file" name="photo" accept=".jpg,.png">
        <br>
        <button type="submit">Upload</button>
    </form>
    <p>Only .jpg and .png files are allowed for upload.</p>
</body>
</html>
