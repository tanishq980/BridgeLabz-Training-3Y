<!DOCTYPE html>
<html>
<head>
    <title>Dropdown-based Selection Page</title>
</head>
<body>
    <h1>Travel Preference Selector</h1>

    <form>
        <!-- Country Dropdown -->
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="india" selected>India</option>
            <option value="japan">Japan</option>
            <option value="france">France</option>
        </select>
        <br><br>

        <!-- State Dropdown -->
        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="maharashtra">Maharashtra</option>
            <option value="karnataka" selected>Karnataka</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="kerala">Kerala</option>
        </select>
        <br><br>

        <!-- City Dropdown -->
        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mumbai">Mumbai</option>
            <option value="bengaluru" selected>Bengaluru</option>
            <option value="jaipur">Jaipur</option>
            <option value="kochi">Kochi</option>
        </select>
        <br><br>

        <!-- Favorite Tourist Place Dropdown -->
        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="lalbagh" selected>Lalbagh Botanical Garden</option>
            <option value="fort">Bengaluru Fort</option>
            <option value="palace">Bangalore Palace</option>
            <option value="museum">Visvesvaraya Museum</option>
        </select>
    </form>

    <!-- Summary Paragraph -->
    <p>Based on the selections above, the chosen destination is Lalbagh Botanical Garden in Bengaluru, Karnataka, India.</p>
</body>
</html>
