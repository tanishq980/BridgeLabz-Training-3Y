<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>
    <!-- School Name -->
    <h1>GLA Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1">
        <tr>
            <th title="Name of the examination subject">Subject</th>
            <th title="Marks scored out of maximum marks">Marks Obtained</th>
            <th title="Maximum marks for the subject">Maximum Marks</th>
            <th title="Grade awarded based on performance">Grade</th>
        </tr>
        <tr>
            <td>English</td>
            <td>85</td>
            <td>100</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>78</td>
            <td>100</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>Social Studies</td>
            <td>88</td>
            <td>100</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
            <td>A+</td>
        </tr>

        <!-- Total and Percentage Row -->
        <tr>
            <td colspan="2" title="Sum of marks obtained in all subjects">Total: 438</td>
            <td colspan="2" title="Overall percentage scored">Percentage: 87.6%</td>
        </tr>
    </table>
</body>
</html>
