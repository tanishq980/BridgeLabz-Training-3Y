<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>
</head>
<body>
    <h1>Course Registration Form</h1>

    <form>
        <!-- Personal Details Fieldset -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        </fieldset>

        <br>

        <!-- Course Selection Fieldset -->
        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Choose a Course:</label>
            <select id="course" name="course">
                <option value="html">HTML Fundamentals</option>
                <option value="css">CSS Styling</option>
                <option value="javascript">JavaScript Programming</option>
                <option value="java">Core Java</option>
                <option value="dsa">Data Structures and Algorithms</option>
            </select>
        </fieldset>

        <br>

        <input type="submit" value="Register">
    </form>

    <!-- Course Schedule Table -->
    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>02:00 PM - 04:00 PM</td>
            <td>Ms. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 01:00 PM</td>
            <td>Mr. Iyer</td>
        </tr>
    </table>
</body>
</html>
