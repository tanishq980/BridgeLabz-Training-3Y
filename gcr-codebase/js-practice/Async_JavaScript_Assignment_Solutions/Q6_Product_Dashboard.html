<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store Product Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #f4f6f8;
            color: #222;
        }
        h1 { text-align: center; }
        #products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px #00000014;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-card img {
            width: 100%;
            height: 170px;
            object-fit: contain;
        }
        .price { font-weight: bold; color: #087443; }
        #status { text-align: center; }
    </style>
</head>
<body>
    <h1>Fake Store – Product Dashboard</h1>
    <p id="status">Loading products...</p>
    <main id="products"></main>

    <!-- This script fetches data and creates cards with JavaScript. -->
    <script src="Q6_Product_Dashboard.js"></script>
</body>
</html>
