<!-- Tells the browser to render this page using the latest HTML5 standard -->
<!DOCTYPE html>
<!-- Root element of the page; lang="en" tells browsers/screen readers/translators the page content is in English -->
<html lang="en">
<head>
    <!-- Sets the character encoding to UTF-8 so special characters and symbols display correctly -->
    <meta charset="UTF-8">
    <!-- Controls layout on mobile browsers: matches page width to device width and sets initial zoom to 100% -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Summarizes the page content; search engines and social media previews may display this text -->
    <meta name="description" content="A brief description of the page content for search engines and social media previews">
    <!-- Lists topic keywords for the page; mostly ignored by modern search engines but still used by some tools -->
    <meta name="keywords" content="HTML, CSS, JavaScript, web development, tutorial">
    <!-- Text shown in the browser tab and used as the default bookmark name -->
    <title>Document</title>
</head>
<body>
    <!-- All visible page content (text, images, elements) goes here -->
     <!-- Empty container element where a JavaScript framework (e.g. React) mounts and renders the app -->
     <div id=" root"></div>
     <!-- Loads the app's entry-point script as an ES module, which builds and injects content into #root -->
     <script type="module" src="/src/main.tsx"></script>
</body>
